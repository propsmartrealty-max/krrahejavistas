name = "kraheja-seo-worker"
main = "seo-worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

# Custom Domain Route Bindings for krahejacorpvistas.com
routes = [
  { pattern = "krahejacorpvistas.com/*", zone_name = "krahejacorpvistas.com", custom_domain = true },
  { pattern = "www.krahejacorpvistas.com/*", zone_name = "krahejacorpvistas.com" }
]

